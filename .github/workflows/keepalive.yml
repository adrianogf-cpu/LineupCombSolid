name: Supabase keepalive

# Free Supabase projects pause after a week of low activity. The Vercel cron
# (vercel.json) only runs once a day on Hobby, so this adds pings in between.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/keepalive
        run: |
          curl -sS --fail-with-body -m 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://lineup-comb-solid.vercel.app/api/keepalive
